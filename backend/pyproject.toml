[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetjedi-backend"
version = "0.1.0"
description = "sheetJEDI backend — AI copilot for Excel and Google Sheets"
readme = "../README.md"
requires-python = ">=3.12"
authors = [{ name = "Denzil Josteve Fernandes", email = "denziljosteve@gmail.com" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.36,<3.0",
    "alembic>=1.14,<2.0",
    "httpx>=0.27,<1.0",
    "cryptography>=44.0,<47.0",
    "openpyxl>=3.1.5,<4.0",
    "pandas>=2.2,<3.0",
    "python-multipart>=0.0.18,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pandas-stubs>=2.2",
]
postgres = [
    "psycopg[binary]>=3.2,<4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
# Tests assert validity immediately before dereferencing optional values;
# mypy cannot follow those runtime assertions.
disable_error_code = ["union-attr", "index", "arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that make real network calls to AI providers (require credentials; excluded by default in CI)",
]
filterwarnings = ["ignore::DeprecationWarning"]
